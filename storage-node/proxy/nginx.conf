upstream storage_backend {
    zone storage_nodes 64k;

    server master:7070   max_fails=1 fail_timeout=10s;
    server replica1:7070 max_fails=1 fail_timeout=10s;
    server replica2:7070 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;
    http2 on;

    proxy_connect_timeout 1s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 5s;
    location = /api/v1/addValue {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 5s;
        proxy_pass http://storage_backend;
    }
    location ~ ^/api/v1/value/[^/]+$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 5s;
        proxy_pass http://storage_backend;      
    }
    location ~ ^/api/v1/values/[^/]+$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 5s;

        proxy_pass http://storage_backend;
    }
}