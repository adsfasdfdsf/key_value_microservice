services:
  auth:
    build: ./auth
    networks:
      - default
    ports:
      - "1128:1128"
    depends_on:
      auth_db:
        condition: service_healthy

      
  auth_db:
    container_name: postgres
    image: postgres:18.6
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db
      POSTGRES_PORT: 5432
    volumes:
      - auth_db:/data/postgres

      - ./auth/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  auth_db:
  redis_data:


networks:
  default: