services:
  master:
    build: ./storage-node
    environment:
      ROLE: master
      REST_PORT: "7070"
      GRPC_PORT: "4040"
      POSTGRES_DSN: postgres://root:123@master_db:5432/db?sslmode=disable
    depends_on:
      master_db:
        condition: service_healthy
      replica1:
        condition: service_started
      replica2:
        condition: service_started

  replica1:
    build: ./storage-node
    environment:
      ROLE: replica
      REST_PORT: "7070"
      GRPC_PORT: "4040"
      POSTGRES_DSN: postgres://root:123@replica1_db:5432/db?sslmode=disable
    depends_on:
      replica1_db:
        condition: service_healthy

  replica2:
    build: ./storage-node
    environment:
      ROLE: replica
      REST_PORT: "7070"
      GRPC_PORT: "4040"
      POSTGRES_DSN: postgres://root:123@replica2_db:5432/db?sslmode=disable
    depends_on:
      replica2_db:
        condition: service_healthy


  nginx:
      image: nginx
      container_name: nginx-container
      ports:
        - "80:80"
      volumes:
        - ./storage-node/proxy/nginx.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - master
        - replica1
        - replica2
  master_db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db
    volumes:
      - master_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db"]
      interval: 2s
      timeout: 5s
      retries: 15

  replica1_db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db
    volumes:
      - replica1_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db"]
      interval: 2s
      timeout: 5s
      retries: 15

  replica2_db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db
    volumes:
      - replica2_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db"]
      interval: 2s
      timeout: 5s
      retries: 15

  auth:
    build: ./auth
    networks:
      - default
    ports:
      - "1128:1128"
    depends_on:
      auth_db:
        condition: service_healthy

      
  auth_db:
    container_name: postgres
    image: postgres:18.6
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db
      POSTGRES_PORT: 5432
    volumes:
      - auth_db:/data/postgres

      - ./auth/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  master_db:
  replica1_db:
  replica2_db:
  auth_db:
  redis_data:


networks:
  default: