services:
  master:
    build: ./storage-node
    restart: unless-stopped
    environment:
      NODE_ID: node-1
      NODE_GRPC_ADDRESS: master:4040
      ROLE: master
      PEER_GRPC_ADDRESSES: replica1:4040,replica2:4040
      REST_PORT: "7070"
      GRPC_PORT: "4040"
      POSTGRES_DSN: postgres://root:123@master_db:5432/db?sslmode=disable
    depends_on:
      storage_schema:
        condition: service_completed_successfully
      master_db:
        condition: service_healthy
      replica1:
        condition: service_started
      replica2:
        condition: service_started

  replica1:
    build: ./storage-node
    restart: unless-stopped
    environment:
      NODE_ID: node-2
      NODE_GRPC_ADDRESS: replica1:4040
      ROLE: replica
      PEER_GRPC_ADDRESSES: master:4040,replica2:4040
      LEADER_GRPC_ADDRESS: master:4040
      REST_PORT: "7070"
      GRPC_PORT: "4040"
      POSTGRES_DSN: postgres://root:123@replica1_db:5432/db?sslmode=disable
    depends_on:
      storage_schema:
        condition: service_completed_successfully
      replica1_db:
        condition: service_healthy

  replica2:
    build: ./storage-node
    restart: unless-stopped
    environment:
      NODE_ID: node-3
      NODE_GRPC_ADDRESS: replica2:4040
      ROLE: replica
      PEER_GRPC_ADDRESSES: master:4040,replica1:4040
      LEADER_GRPC_ADDRESS: master:4040
      REST_PORT: "7070"
      GRPC_PORT: "4040"
      POSTGRES_DSN: postgres://root:123@replica2_db:5432/db?sslmode=disable
    depends_on:
      storage_schema:
        condition: service_completed_successfully
      replica2_db:
        condition: service_healthy


  nginx:
      image: nginx:alpine
      restart: unless-stopped
      ports:
        - "127.0.0.1:80:80"
      volumes:
        - ./storage-node/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        - ./storage-node/proxy/healthcheck.sh:/docker-entrypoint.d/40-healthcheck.sh:ro
      depends_on:
        - master
        - replica1
        - replica2
  master_db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db
    volumes:
      - master_db:/var/lib/postgresql
      - ./storage-node/internal/storage/postgres/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db"]
      interval: 2s
      timeout: 5s
      retries: 15

  replica1_db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db
    volumes:
      - replica1_db:/var/lib/postgresql
      - ./storage-node/internal/storage/postgres/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db"]
      interval: 2s
      timeout: 5s
      retries: 15

  replica2_db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db
    volumes:
      - replica2_db:/var/lib/postgresql
      - ./storage-node/internal/storage/postgres/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db"]
      interval: 2s
      timeout: 5s
      retries: 15

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - auth

  storage_schema:
    image: postgres:18.6
    environment:
      PGPASSWORD: "123"
    volumes:
      - ./storage-node/internal/storage/postgres/schema.sql:/schema.sql:ro
    depends_on:
      master_db:
        condition: service_healthy
      replica1_db:
        condition: service_healthy
      replica2_db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'for host in master_db replica1_db replica2_db; do psql -v ON_ERROR_STOP=1 -h "$$host" -U root -d db -f /schema.sql; done'

  auth:
    build: ./auth
    restart: unless-stopped
    environment:
      STORAGE_URL: http://nginx
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-local-access-secret-change-before-deploy}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-local-refresh-secret-change-before-deploy}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks:
      - default
    ports:
      - "127.0.0.1:1128:1128"
    depends_on:
      auth_db:
        condition: service_healthy
      nginx:
        condition: service_started

      
  auth_db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db
      POSTGRES_PORT: 5432
    volumes:
      - auth_db:/var/lib/postgresql

      - ./auth/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d db" ]
      interval: 2s
      timeout: 10s
      retries: 5

volumes:
  master_db:
  replica1_db:
  replica2_db:
  auth_db:
  redis_data:


networks:
  default:
