services:
  master:
    build: ./storage-node
    environment:
      - ROLE=master
      - REST_PORT=7070
      - GRPC_PORT=0000
    networks:
      - default
    depends_on:
      - replica1
      - replica2

  replica1:
    build: ./storage-node
    environment:
      - ROLE=replica
      - REST_PORT=7070
      - GRPC_PORT=4040
    networks:
      - default
  
  replica2:
    build: ./storage-node
    environment:
      - ROLE=replica
      - REST_PORT=7070
      - GRPC_PORT=4040
    networks:
      - default
  


  nginx:
      image: nginx
      container_name: nginx-container
      ports:
        - "80:80"
      volumes:
        - ./storage-node/proxy/nginx.conf:/etc/nginx/conf.d/default.conf
      depends_on:
        - master
        - replica1
        - replica2
  auth:
    build: ./auth
    networks:
      - default
    ports:
      - "1128:1128"
    depends_on:
      auth_db:
        condition: service_healthy

      
  auth_db:
    container_name: postgres
    image: postgres:18.6
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: db
      POSTGRES_PORT: 5432
    volumes:
      - auth_db:/data/postgres

      - ./auth/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  auth_db:
  redis_data:


networks:
  default: