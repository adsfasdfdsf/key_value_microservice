services:
  auth:
    build: ./auth
    networks:
      - default
    depends_on:
      auth_db:
        condition: service_healthy
      
  auth_db:
    container_name: postgres
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /data/postgres
      POSTGRES_DB: bank
    volumes:
      - db:/data/postgres

      - ./auth/init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db:


networks:
  default: